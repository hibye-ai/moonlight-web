<!DOCTYPE html>
<html lang="ko-KR" class="notranslate">

<head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="google" content="notranslate" />
    <title>Moonlight</title>
    <link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml">

    <link rel="stylesheet" href="styles/app.css">

    <script type="module" src="index.js" defer></script>

    <!-- Manifest for Mobile Apps as Website -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="description" content="Moonlight Web for game streaming with your pc" />
    <link rel="manifest" href="manifest.json">

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Moonlight Web">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const aliases = { zh: "zh-CN", zh_CN: "zh-CN", pt: "pt-BR", pt_BR: "pt-BR", ko: "ko-KR", ko_KR: "ko-KR" };
            const requested = parsed && parsed.language ? parsed.language : "ko-KR";
            const language = aliases[requested] || (["en", "zh-CN", "pt-BR", "fr-FR", "ko-KR"].includes(requested) ? requested : "ko-KR");
            const themeMode = parsed && ["system", "dark", "light"].includes(parsed.theme) ? parsed.theme : "dark";
            const theme = themeMode === "system"
                ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
                : themeMode;
            document.documentElement.dataset.themeMode = themeMode;
            document.documentElement.dataset.theme = theme;
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
</head>

<body>
    <!-- Modal -->
    <div id="modal-overlay" class="modal-background modal-disabled">
        <!-- Modal Content -->
        <div id="modal-parent" class="modal-content">
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu-background context-menu-disabled">
    </div>

    <!-- Notification -->
    <div id="notification-list">
    </div>

    <!-- Main App View -->
    <div id="root" class="root">
    </div>

</body>

</html>
